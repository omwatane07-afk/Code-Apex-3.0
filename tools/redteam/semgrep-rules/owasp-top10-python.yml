# Custom red-team rules, not vendored
# Authored locally for CYBERQ security verification (Injection, Cryptography, Secrets, Deserialization, Path Traversal)

rules:
  - id: python-deserialization-pickle
    languages: [python]
    severity: ERROR
    message: "Avoid using pickle for deserialization of untrusted data as it can lead to arbitrary code execution."
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: _pickle.loads(...)
          - pattern: _pickle.load(...)
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  - id: python-insecure-subprocess-shell
    languages: [python]
    severity: ERROR
    message: "subprocess call with shell=True is dangerous and can lead to command injection."
    patterns:
      - pattern-either:
          - pattern: subprocess.$FUNC(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"

  - id: python-insecure-hash-md5-sha1
    languages: [python]
    severity: WARNING
    message: "MD5 or SHA1 is a cryptographically weak hash algorithm. Use SHA-256 or SHA-512 for security purposes."
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: python-sql-injection-format-string
    languages: [python]
    severity: ERROR
    message: "Raw SQL query string constructed via string formatting or interpolation. Use query parameters instead."
    patterns:
      - pattern-either:
          - pattern: $CONN.execute(f"...", ...)
          - pattern: $CONN.execute("..." % (...), ...)
          - pattern: $CONN.execute("...".format(...), ...)
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"

  - id: python-arbitrary-file-open
    languages: [python]
    severity: WARNING
    message: "File opened with dynamically formatted path without validation may permit directory traversal."
    patterns:
      - pattern-either:
          - pattern: open(f"...{$VAR}...", ...)
          - pattern: open("..." % $VAR, ...)
    metadata:
      cwe: "CWE-22: Path Traversal"
      owasp: "A01:2021 - Broken Access Control"

  - id: python-jwt-none-algorithm
    languages: [python]
    severity: ERROR
    message: "JWT decoded or encoded with 'none' algorithm disables signature verification."
    patterns:
      - pattern: jwt.decode(..., algorithms=[..., "none", ...], ...)
    metadata:
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: python-hardcoded-secret-assignment
    languages: [python]
    severity: WARNING
    message: "Potential hardcoded secret or API credential detected in assignment."
    patterns:
      - pattern-either:
          - pattern: $X = "=SECRET_KEY_..."
          - pattern: $X = "=PRIVATE_KEY_..."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
