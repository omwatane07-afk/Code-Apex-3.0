[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberq"
version = "0.1.0"
description = "CYBERQ - Bank-deployable incident-to-board layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "structlog>=24.4.0",
    "cryptography>=43.0.0",
    "authlib>=1.3.1",
    "pyotp>=2.9.0",
    "argon2-cffi>=23.1.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "schemathesis>=3.28.0",
    "ruff>=0.6.8",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyberq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S", "C4", "UP"]
ignore = ["S101", "B008", "E501", "S105", "S106", "S603", "S607"]


[tool.mypy]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", ".."]
asyncio_mode = "auto"
markers = [
    "postgres: tests requiring a live PostgreSQL 16 database connection via CYBERQ_TEST_PG_URL"
]
